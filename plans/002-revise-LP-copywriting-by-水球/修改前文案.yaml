  start: START
  goal: GOAL
  checkpoint: CP
  stepCta: 前往
  resultLabel: 你的時間
  resultNote: 計時到此為止，接下來不用趕。
  ctaPrimary: 提交自介
  ctaSecondary: 加入 Discord
  event:
    label: 正在進行
    title: 想問矽谷大佬關於創業出海的問題？
    body: 到 Discord 活動串留下你的問題，我們收集起來拿去問。
    cta: 留下問題
    via: Discord 活動串


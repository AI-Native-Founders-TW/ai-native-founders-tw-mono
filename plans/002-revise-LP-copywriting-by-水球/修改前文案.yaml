  title: 用一份筆記，槓桿全台創業者的認知。
  # 標題的斷行點（合起來必須等於 title）；桌機會把後兩段放在同一行
  titleLines:
    - 用一份筆記，
    - 槓桿全台
    - 創業者的認知。
  subtitle: 一起收集前輩的經驗，整理成大家都能用的開源筆記。不必再自己造輪子、自己建人脈、自己摸索。
  ctaPrimary: 提交自介，加入 run
  ctaSecondary: 先看我們想解決什麼
  scrollHint: Scroll to start
  coords: 25.03°N 121.56°E · TPE
